name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1) Offline Urdu voices: download Piper models (MIT) from Hugging Face,
  #    convert them for sherpa-onnx, TEST that each one speaks Urdu,
  #    then publish them as release "voices-v1" (the app downloads from there).
  # ------------------------------------------------------------------
  voices:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check which voices are already published
        id: check
        run: |
          names=$(gh release view voices-v1 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          echo "$names"
          if echo "$names" | grep -q "ur_PK-aegis_female-medium.zip" && echo "$names" | grep -q "ur_PK-fasih-medium.zip"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: '3.11'

      - name: Convert + test Urdu voices
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          pip install onnx onnxruntime sherpa-onnx numpy
          mkdir -p work && cd work
          # Male: official sherpa-onnx package of rhasspy ur_PK-fasih-medium (already converted, incl. espeak-ng-data)
          curl -fL -o fasih.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ur_PK-fasih-medium.tar.bz2
          tar xjf fasih.tar.bz2
          ls -la vits-piper-ur_PK-fasih-medium
          OFF=vits-piper-ur_PK-fasih-medium
          mkdir -p ur_PK-fasih-medium
          cp $OFF/ur_PK-fasih-medium.onnx ur_PK-fasih-medium/model.onnx
          cp $OFF/tokens.txt ur_PK-fasih-medium/tokens.txt
          cp -r $OFF/espeak-ng-data .
          # Female: rhasspy ur_PK-aegis_female-medium (MIT), converted using the official model's metadata as template
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/aegis_female/medium
          curl -fL -o ur_PK-aegis_female-medium.onnx      "$HF/ur_PK-aegis_female-medium.onnx"
          curl -fL -o ur_PK-aegis_female-medium.onnx.json "$HF/ur_PK-aegis_female-medium.onnx.json"
          cat > convert.py <<'PY'
          import json, os, sys, onnx
          name, template = sys.argv[1], sys.argv[2]
          cfg = json.load(open(name + ".onnx.json", encoding="utf-8"))
          os.makedirs(name, exist_ok=True)
          with open(os.path.join(name, "tokens.txt"), "w", encoding="utf-8") as f:
              for s, i in cfg["phoneme_id_map"].items():
                  f.write(f"{s} {i[0] if isinstance(i, list) else i}\n")
          meta = {p.key: p.value for p in onnx.load(template, load_external_data=False).metadata_props}
          print("template metadata:", meta)
          meta["sample_rate"] = str(cfg["audio"]["sample_rate"])
          meta["n_speakers"] = str(cfg.get("num_speakers", 1))
          meta["voice"] = cfg.get("espeak", {}).get("voice", meta.get("voice", "ur"))
          model = onnx.load(name + ".onnx")
          while len(model.metadata_props):
              model.metadata_props.pop()
          for k, v in meta.items():
              p = model.metadata_props.add(); p.key = k; p.value = v
          onnx.save(model, os.path.join(name, "model.onnx"))
          print(name, "metadata:", meta)
          PY
          cat > test.py <<'PY'
          import sys, wave, numpy as np, sherpa_onnx
          name = sys.argv[1]
          cfg = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model=f"{name}/model.onnx", lexicon="", tokens=f"{name}/tokens.txt", data_dir="espeak-ng-data"),
                  num_threads=2, debug=True, provider="cpu"),
              max_num_sentences=1)
          assert cfg.validate(), "invalid config"
          tts = sherpa_onnx.OfflineTts(cfg)
          text = "السلام علیکم۔ یہ حاجی ایپ کی اردو آواز ہے، اور یہ کتاب پڑھ کر سنا رہی ہے۔"
          a = tts.generate(text, sid=0, speed=1.0)
          x = np.array(a.samples, dtype=np.float32)
          dur = len(x) / a.sample_rate
          rms = float(np.sqrt(np.mean(x * x))) if len(x) else 0.0
          print(f"{name}: {dur:.2f} s, rate {a.sample_rate}, rms {rms:.4f}")
          assert dur > 2.0 and rms > 0.01, "voice test FAILED (silent or too short)"
          with wave.open(f"sample-{name}.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(a.sample_rate)
              w.writeframes((np.clip(x, -1, 1) * 32767).astype(np.int16).tobytes())
          PY
          python convert.py ur_PK-aegis_female-medium $OFF/ur_PK-fasih-medium.onnx || echo "::error::female conversion failed"
          ok=0
          : > assets.txt
          for n in ur_PK-fasih-medium ur_PK-aegis_female-medium; do
            if [ -f $n/model.onnx ] && python test.py $n; then
              (cd $n && zip -q ../$n.zip model.onnx tokens.txt)
              echo "$n.zip sample-$n.wav" >> assets.txt
              ok=$((ok+1))
            else
              echo "::error::Voice $n did not pass the Urdu speech test - not published"
            fi
          done
          zip -qr espeak-ng-data.zip espeak-ng-data
          echo "voices passed: $ok"
          [ "$ok" -ge 1 ]

      - name: Publish voices
        if: steps.check.outputs.exists == 'false'
        run: |
          cd work
          if gh release view voices-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload voices-v1 --repo "$GITHUB_REPOSITORY" --clobber espeak-ng-data.zip $(cat assets.txt)
          else
            gh release create voices-v1 --repo "$GITHUB_REPOSITORY" \
              --title "HAJI APP offline Urdu voices (Piper, MIT)" \
              --notes "rhasspy/piper-voices (MIT) prepared for sherpa-onnx; each voice passed an Urdu speech test in CI. Samples included." \
              espeak-ng-data.zip $(cat assets.txt)
          fi

  # ------------------------------------------------------------------
  # 2) Build the app
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: voices
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o project.zip -d src

      - name: Download sherpa-onnx Android library (Apache-2.0)
        run: |
          mkdir -p src/app/libs
          curl -fL -o src/app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          ls -la src/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp src/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk   HAJI-APP-arm64.apk
          cp src/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk HAJI-APP-armv7.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HAJI-APP-APK
          path: "*.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HAJI APP 3.1 build ${{ github.run_number }}
          body: |
            Most phones: HAJI-APP-arm64.apk
            Older/cheaper phones (32-bit): HAJI-APP-armv7.apk
          files: |
            HAJI-APP-arm64.apk
            HAJI-APP-armv7.apk
