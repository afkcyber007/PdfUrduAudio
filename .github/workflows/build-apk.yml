name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o project.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk PdfUrduAudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PdfUrduAudio-APK
          path: PdfUrduAudio.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF Urdu Audio build ${{ github.run_number }}
          files: PdfUrduAudio.apk
