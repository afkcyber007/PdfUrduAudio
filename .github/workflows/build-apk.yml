name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1) Offline Urdu voices: download Piper models (MIT) from Hugging Face,
  #    convert them for sherpa-onnx, TEST that each one speaks Urdu,
  #    then publish them as release "voices-v1" (the app downloads from there).
  # ------------------------------------------------------------------
  voices:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check if voices are already published
        id: check
        run: |
          if gh release view voices-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: '3.11'

      - name: Convert + test Urdu voices
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          pip install onnx==1.17.0 onnxruntime==1.17.1 sherpa-onnx numpy
          mkdir -p work && cd work
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK
          for v in fasih aegis_female; do
            curl -fL -o ur_PK-$v-medium.onnx      "$HF/$v/medium/ur_PK-$v-medium.onnx"
            curl -fL -o ur_PK-$v-medium.onnx.json "$HF/$v/medium/ur_PK-$v-medium.onnx.json"
          done
          curl -fL -o espeak-ng-data.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2
          tar xjf espeak-ng-data.tar.bz2
          cat > convert.py <<'PY'
          # Same steps as the official sherpa-onnx piper.py: tokens.txt + ONNX metadata.
          import json, os, sys, onnx
          name = sys.argv[1]
          cfg = json.load(open(name + ".onnx.json", encoding="utf-8"))
          os.makedirs(name, exist_ok=True)
          with open(os.path.join(name, "tokens.txt"), "w", encoding="utf-8") as f:
              for s, i in cfg["phoneme_id_map"].items():
                  f.write(f"{s} {i[0]}\n")
          model = onnx.load(name + ".onnx")
          while len(model.metadata_props):
              model.metadata_props.pop()
          meta = {
              "model_type": "vits", "comment": "piper",
              "language": cfg.get("language", {}).get("name_english", "Urdu"),
              "voice": cfg.get("espeak", {}).get("voice", "ur"),
              "has_espeak": 1,
              "n_speakers": cfg.get("num_speakers", 1),
              "sample_rate": cfg["audio"]["sample_rate"],
          }
          for k, v in meta.items():
              p = model.metadata_props.add(); p.key = k; p.value = str(v)
          onnx.save(model, os.path.join(name, "model.onnx"))
          print(name, meta)
          PY
          cat > test.py <<'PY'
          import sys, wave, numpy as np, sherpa_onnx
          name = sys.argv[1]
          cfg = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                      model=f"{name}/model.onnx", lexicon="", tokens=f"{name}/tokens.txt", data_dir="espeak-ng-data"),
                  num_threads=2, debug=False, provider="cpu"),
              max_num_sentences=1)
          assert cfg.validate(), "invalid config"
          tts = sherpa_onnx.OfflineTts(cfg)
          text = "السلام علیکم۔ یہ حاجی ایپ کی اردو آواز ہے، اور یہ کتاب پڑھ کر سنا رہی ہے۔"
          a = tts.generate(text, sid=0, speed=1.0)
          x = np.array(a.samples, dtype=np.float32)
          dur = len(x) / a.sample_rate
          rms = float(np.sqrt(np.mean(x * x))) if len(x) else 0.0
          print(f"{name}: {dur:.2f} s, rate {a.sample_rate}, rms {rms:.4f}")
          assert dur > 2.0 and rms > 0.01, "voice test FAILED (silent or too short)"
          with wave.open(f"sample-{name}.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(a.sample_rate)
              w.writeframes((np.clip(x, -1, 1) * 32767).astype(np.int16).tobytes())
          PY
          for v in fasih aegis_female; do
            n=ur_PK-$v-medium
            python convert.py $n
            python test.py $n
            (cd $n && zip -q ../$n.zip model.onnx tokens.txt)
          done
          zip -qr espeak-ng-data.zip espeak-ng-data
          ls -la *.zip *.wav

      - name: Publish voices
        if: steps.check.outputs.exists == 'false'
        run: |
          cd work
          gh release create voices-v1 --repo "$GITHUB_REPOSITORY" \
            --title "HAJI APP offline Urdu voices (Piper, MIT)" \
            --notes "Converted from rhasspy/piper-voices (MIT) for sherpa-onnx and tested in CI. Samples included." \
            ur_PK-fasih-medium.zip ur_PK-aegis_female-medium.zip espeak-ng-data.zip \
            sample-ur_PK-fasih-medium.wav sample-ur_PK-aegis_female-medium.wav

  # ------------------------------------------------------------------
  # 2) Build the app
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: voices
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o project.zip -d src

      - name: Download sherpa-onnx Android library (Apache-2.0)
        run: |
          mkdir -p src/app/libs
          curl -fL -o src/app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          ls -la src/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp src/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk   HAJI-APP-arm64.apk
          cp src/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk HAJI-APP-armv7.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HAJI-APP-APK
          path: "*.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HAJI APP 3.0 build ${{ github.run_number }}
          body: |
            Most phones: HAJI-APP-arm64.apk
            Older/cheaper phones (32-bit): HAJI-APP-armv7.apk
          files: |
            HAJI-APP-arm64.apk
            HAJI-APP-armv7.apk
